<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EXON | Evolutionary Intelligence Architecture</title>
    
    <!-- Core Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; background: #010204; color: white; font-family: 'Exo 2', sans-serif; overflow: hidden; touch-action: none; }
        .exo-font { font-family: 'Exo 2', sans-serif; }
        
        /* Intro Animation */
        .intro-logo { font-weight: 200; letter-spacing: 1.5em; transition: all 2.5s cubic-bezier(0.4, 0, 0.2, 1); text-align: center; }
        .logo-initial { opacity: 0.5; color: #ffffff; text-shadow: none; filter: blur(0); transform: scale(0.9); }
        .logo-glowing { 
            opacity: 1; 
            color: #00ffff; 
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.9), 0 0 50px rgba(0, 255, 255, 0.7); 
            filter: blur(0); 
            transform: scale(1); 
        }
        .logo-dissolving { 
            opacity: 0; 
            color: #00ffff; 
            text-shadow: 0 0 120px #00ffff; 
            filter: blur(60px); 
            transform: scale(1.8); 
        }

        /* Focus In Entry Animation */
        .content-focus-in { animation: focus-in 2s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        @keyframes focus-in { 0% { filter: blur(35px); opacity: 0; transform: scale(0.98); } 100% { filter: blur(0); opacity: 1; transform: scale(1); } }

        /* Cinematic Title Transition (Morphing) */
        .title-morph {
            transition: all 1.1s cubic-bezier(0.19, 1, 0.22, 1);
            position: absolute;
            width: 100%;
            left: 0;
            text-align: left;
            z-index: 100;
        }
        .title-big { top: 40%; transform: translateY(-50%) scale(2.6); filter: blur(25px); opacity: 0; pointer-events: none; padding-left: 2.5rem; }
        .title-normal { top: 0; transform: translateY(0) scale(1); filter: blur(0); opacity: 1; position: relative; padding-left: 0; }

        /* Content Reveal Timing */
        .content-reveal { transition: all 1.2s ease-out; transition-delay: 0.5s; }
        .content-hidden { opacity: 0; filter: blur(30px); transform: translateY(10px); }
        .content-visible { opacity: 1; filter: blur(0); transform: translateY(0); }

        .logo-style-header { font-weight: 200; letter-spacing: 0.7em; color: #00ffff; text-shadow: 0 0 15px rgba(0, 255, 255, 0.8), 0 0 30px rgba(0, 255, 255, 0.4); }
        .scrollbar-hidden::-webkit-scrollbar { width: 0px; height: 0px; }
        
        .tech-table { width: 100%; border-collapse: collapse; font-size: 10px; margin: 15px 0; border: 1px solid rgba(0, 255, 255, 0.1); }
        .tech-table th { background: rgba(0, 255, 255, 0.1); color: #00ffff; padding: 8px; border-bottom: 1px solid rgba(0, 255, 255, 0.2); text-align: left; }
        .tech-table td { padding: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); text-align: left; }

        /* Angled Frame with 1px Precision Line */
        .logo-angled-frame {
            border-left: 1px solid #00ffff; 
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.12) 0%, rgba(0, 255, 255, 0.02) 100%);
            position: relative;
            clip-path: polygon(0% 0%, 100% 0%, 96% 100%, 0% 100%);
            box-shadow: -5px 0 25px rgba(0, 255, 255, 0.1);
        }

        #neural-canvas { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Neural Ribbon Generative Background ---
        const NeuralBackground = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;
                
                const filaments = [];
                const filamentCount = 95; 

                class Filament {
                    constructor() { this.init(); }
                    init() {
                        this.x = width / 2;
                        this.y = height / 2;
                        this.targetX = Math.random() * width * 1.6 - width * 0.3;
                        this.targetY = Math.random() * height * 1.6 - height * 0.3;
                        this.cp1x = Math.random() * width;
                        this.cp1y = Math.random() * height;
                        this.cp2x = Math.random() * width;
                        this.cp2y = Math.random() * height;
                        this.lineWidth = Math.random() > 0.82 ? 7 + Math.random() * 15 : 0.2 + Math.random() * 2; 
                        this.pulse = Math.random() * Math.PI;
                        this.pulseSpeed = 0.005 + Math.random() * 0.015;
                        this.rotation = Math.random() * Math.PI * 2;
                        this.rotationSpeed = (Math.random() - 0.5) * 0.001;
                        this.opacityBase = 0.08 + Math.random() * 0.4;
                    }
                    draw(globalRotation) {
                        this.pulse += this.pulseSpeed;
                        const breath = (Math.sin(this.pulse) + 1) / 2;
                        ctx.save();
                        ctx.translate(width / 2, height / 2);
                        ctx.rotate(this.rotation + globalRotation);
                        ctx.translate(-width / 2, -height / 2);
                        
                        const grad = ctx.createLinearGradient(this.x, this.y, this.targetX, this.targetY);
                        grad.addColorStop(0, `rgba(0, 255, 255, 0)`); 
                        grad.addColorStop(0.3, `rgba(0, 255, 255, ${breath * this.opacityBase})`);
                        grad.addColorStop(0.7, `rgba(0, 255, 255, ${breath * this.opacityBase})`);
                        grad.addColorStop(1, `rgba(0, 255, 255, 0)`); 

                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y);
                        ctx.bezierCurveTo(this.cp1x, this.cp1y, this.cp2x, this.cp2y, this.targetX, this.targetY);
                        ctx.globalCompositeOperation = 'lighter';
                        ctx.strokeStyle = grad;
                        ctx.lineWidth = this.lineWidth * breath;
                        ctx.stroke();

                        if (this.lineWidth > 6) {
                            ctx.strokeStyle = `rgba(255, 255, 255, ${breath * 0.15})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                        ctx.restore();
                        this.rotation += this.rotationSpeed;
                        if(Math.random() > 0.998) this.init(); 
                    }
                }
                for(let i=0; i<filamentCount; i++) filaments.push(new Filament());
                let globalRotation = 0;
                const render = () => {
                    ctx.clearRect(0, 0, width, height);
                    ctx.fillStyle = '#010204';
                    ctx.fillRect(0, 0, width, height);
                    globalRotation += 0.0003;
                    filaments.forEach(f => f.draw(globalRotation));
                    animationFrameId = requestAnimationFrame(render);
                };
                render();
                const handleResize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
                window.addEventListener('resize', handleResize);
                return () => { cancelAnimationFrame(animationFrameId); window.removeEventListener('resize', handleResize); };
            }, []);
            return <canvas id="neural-canvas" ref={canvasRef} />;
        };

        const Icon = ({ name, color = "currentColor", size = 24, strokeWidth = 2, className = "" }) => {
            const icons = {
                chevronDown: <polyline points="6 9 12 15 18 9"></polyline>,
                chevronLeft: <polyline points="15 18 9 12 15 6"></polyline>,
                chevronRight: <polyline points="9 18 15 12 9 6"></polyline>,
                cpu: <><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="15" x2="23" y2="15"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="15" x2="4" y2="15"></line></>,
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>,
                refresh: <><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></>,
                trending: <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></>,
                target: <><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('01');
            const [introStatus, setIntroStatus] = useState('starting'); 
            const [scrollProgress, setScrollProgress] = useState(0);
            const [isMorphing, setIsMorphing] = useState(true); 
            const scrollRef = useRef(null);

            const WHITE_PAPER = {
                '01': { label: "MANIFESTO", title: "01. BRAND MANIFESTO", subtitle: "Intelligent Business Organism", icon: "cpu",
                    content: [
                        "\"Automation is not the end. It is merely the beginning of evolution.\"",
                        "Most automation tools on the market simply mimic 'human repetition.' However, modern business is a living organism. Static tools that stop when the environment changes no longer have global competitiveness. EXON redesigns the 'neural network' of business.",
                        "We have integrated ChatGPT's advanced reasoning capabilities onto the robust logical backbone of n8n. It is not just a time-saving tool; it provides a Intelligent Organism (Intelligent Organism) that senses situations and evolves to find optimal paths. EXON agents do not just follow a set path; they read the flow of data at every moment and make optimal decisions for growth.",
                        "We aim for a system where every business process is connected like a cell and responds fluidly. This is the only way to break through the limits of human resources and build a business territory capable of infinite expansion. We prove that the era of labor is fading and the era of intelligent assets has arrived.",
                        "Adopting the EXON system is not just about reducing labor costs; it is about obtaining a powerful 'Intelligent Commander' that learns data 24/7 and makes decisions on your behalf. Escape the swamp of operations and possess the overwhelming profit and freedom of time that the system provides."
                    ]
                },
                '02': { label: "PRODUCTION", title: "02. FULL-AUTO ENGINE", subtitle: "E2E Content Orchestration", icon: "zap",
                    content: [
                        "The essence of profit starts with 'Overwhelming Awareness,' and awareness is sustained by 'Massive Volume.' EXON orchestrates dozens of the latest AI engines and APIs, including Midjourney, Runway, Kling, and ElevenLabs, in real-time within a single system.",
                        "We have fully automated the entire process, from planning to image generation, high-resolution video production, and multi-language voice synthesis. Produced content is instantly uploaded to dedicated cloud servers and spread to hundreds of global SNS channels without your intervention. In this process, the human role is only to input the initial 'Intent.'",
                        "We have completely destroyed the physical barriers of 'Production Cost' and 'Upload Resources.' Now, the scale of your business is determined by the processing capacity of the intelligent infrastructure you possess, not the amount of capital. Experience the overwhelming efficiency of a single manager directing hundreds of creative and operations teams simultaneously.",
                        "EXON's engine does not just produce a lot; it is monitored by a Standardized Controller to maintain the brand's unique tone and manner in every creation. It is a unique architecture that simultaneously captures both quality consistency and quantitative expansion."
                    ],
                    table: {
                        headers: ["Metric", "Traditional Experts", "EXON System"],
                        rows: [
                            ["Production Cost", "Over $100/unit", "Under $0.5/unit"],
                            ["Production Speed", "1-2 units/day limit", "Real-time (24/7 Infinite)"],
                            ["Channel Scaling", "Human Management Limit", "Immediate response (Hundreds)"],
                            ["Ops Pipeline", "Manual Upload/Management", "100% E2E Full-Auto"]
                        ]
                    }
                },
                '03': { label: "DATA MINING", title: "03. PRECISION LABELING", subtitle: "Sensing the DNA of Success", icon: "shield",
                    content: [
                        "Content spread infinitely is not just marketing material. It is a 'Data Sensor' that detects microscopic tremors in the global market. EXON assigns a unique 'Creative ID' to every output and logs every interaction data.",
                        "Creative ID is not just a simple serial number. It meticulously labels and stores hundreds of components such as background colors, model's gaze, object composition, font size of subtitles, transition rhythm of video, and the beat of BGM as metadata.",
                        "The data collected this way proves in seconds 'which element' drew the strongest purchase response from 'which target.' Now, instead of gambling on 'intuition,' you can enter the marketing battlefield with a 'Master Blueprint of Success' proven by data. Visualizing the invisible laws of success into data is the precision of EXON.",
                        "Data labeling is the foundation of EXON's intelligence. By converting invisible consumer psychology into numbers, we provide a clear compass for which direction your business should move to maximize profit. This is equivalent to having control over the destiny of your business beyond simple tracking."
                    ]
                },
                '04': { label: "RECYCLE LOOP", title: "04. INTELLIGENT RECYCLE", subtitle: "Heart of Evolution: Recycle Engine", icon: "refresh",
                    content: [
                        "This is the heart that makes EXON unique. Massive amounts of labeled data are immediately sent to the ChatGPT analysis module to self-evaluate the strengths and weaknesses of current logic.",
                        "Analyzed insights are immediately returned (Recycle) to the system logic recursively. Failed patterns are immediately weeded out, and successful genes become powerful standards for the next generation of content generation. As this repeats, the system evolves into a 'Hyper-Precision Intelligence' that transcends human expert intuition.",
                        "The ultimate merit of EXON is this virtuous cycle structure where your involvement decreases over time while profit margins increase exponentially. The moment the amount of data reaches a tipping point, the system moves beyond merely creating content and becomes an intelligent subject that leads market trends.",
                        "The Recycle Engine fundamentally blocks business regression. Through a recursive optimization process where yesterday's learning becomes today's result, and today's result becomes tomorrow's intelligence, your business empire grows by breathing on its own.",
                        "Ultimately, the system will self-establish new marketing hypotheses, verify them through the mass production system, and transform into a perfect 'Knowledge Production Base' without human intervention. This means complete automation of business sovereignty."
                    ]
                },
                '05': { label: "ECONOMICS", title: "05. HYPER LEVERAGE", subtitle: "Profit Scaling & Unmanned Economy", icon: "trending",
                    content: [
                        "EXON aims for 'Zero Marginal Cost' in business. By breaking free from the physical limits of labor and production costs and automating high-quality decision-making based on data, we converge failure costs toward zero.",
                        "Operate hundreds of 'Self-Running Business Units' alone and leverage your profits infinitely. Secured high profits are reinvested back into intelligent infrastructure expansion, enabling exponential development with a near-vertical growth slope. This is not just simple cost reduction.",
                        "It is the process of building an 'Unmanned Profit Empire' where your business learns, analyzes, and earns money on its own. You will no longer be a laborer providing labor, but a commander of a business territory leading hundreds of intelligent cells.",
                        "Economies of scale have now been replaced by economies of intelligence. Generating more data with less cost, creating more profit, and making the system smarter—this is EXON's 21st-century wealth formula. Growth beyond physical constraints is now proven by actual data, not imagination.",
                        "Furthermore, through multi-language support engines and localization automation, your message reaches hundreds of millions of potential customers globally in real-time. Experience a new economic order where individual productivity converges to infinity. EXON transforms your capital into the most efficient intelligent army."
                    ],
                    chart: true
                },
                '06': { label: "FUTURE", title: "06. TOTAL AUTONOMY", subtitle: "The Standard for Unmanned Commerce", icon: "target",
                    content: [
                        "We look beyond making images and aim for the 'De-humanization' of the entire business process. EXON's journey is just beginning.",
                        "From product sourcing data analysis to automatic landing page construction, target-specific personalized marketing material generation, and customer service (CS), we will complete an 'Unmanned Business Intelligence' that autonomously performs every touchpoint of business.",
                        "Expand your territory worldwide by immediately replicating (Scalability) proven success logic to other industry sectors. It is time to become the master of true 'Digital Power' unconstrained by human resources. The future belongs to those who possess intelligence and have built an automated Recycle Engine. Seize and own that future first with EXON.",
                        "The future we dream of is a world where humans are completely liberated from mechanical tasks and focus only on 'Strategy' and 'Inspiration.' EXON will be the strongest and most robust bridge to that world.",
                        "Ever-evolving algorithms will submit optimized business reports to you every morning and synchronize profit data occurring across thousands of channels in real-time. Now, leave the area of management to AI and immerse yourself only in the true expansion of your business. EXON proves your infinite possibilities. We invite you to the pinnacle where the history of business is rewritten."
                    ]
                }
            };

            const tabs = Object.keys(WHITE_PAPER);
            const handleTabChange = (num) => {
                if (num === activeTab) return;
                setIsMorphing(true);
                setTimeout(() => {
                    setActiveTab(num);
                    setTimeout(() => setIsMorphing(false), 50);
                }, 300);
            };

            const goToNext = () => handleTabChange(tabs[Math.min(tabs.indexOf(activeTab) + 1, tabs.length - 1)]);
            const goToPrev = () => handleTabChange(tabs[Math.max(tabs.indexOf(activeTab) - 1, 0)]);

            useEffect(() => {
                const t1 = setTimeout(() => setIntroStatus('glowing'), 800);
                const t2 = setTimeout(() => setIntroStatus('dissolving'), 2500);
                const t3 = setTimeout(() => {
                    setIntroStatus('finished');
                    setIsMorphing(false);
                }, 4500);
                return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
            }, []);

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = 0;
                    setScrollProgress(0);
                }
            }, [activeTab]);

            return (
                <div className="h-screen w-screen flex flex-col items-center justify-center p-0 md:p-4 content-focus-in overflow-hidden relative text-white">
                    <NeuralBackground />
                    {introStatus !== 'finished' ? (
                        <div className="fixed inset-0 flex flex-col items-center justify-center z-[999] bg-[#010204]">
                            <h1 className={`intro-logo text-5xl md:text-8xl pl-[1.5em] ${introStatus === 'starting' ? 'logo-initial' : ''} ${introStatus === 'glowing' ? 'logo-glowing' : ''} ${introStatus === 'dissolving' ? 'logo-dissolving' : ''}`}>
                                EXON
                            </h1>
                        </div>
                    ) : (
                        <div className="w-full max-w-md h-full flex flex-col relative">
                            {/* Nav Bar */}
                            <div className="w-full grid grid-cols-6 gap-0.5 bg-zinc-900/75 p-1 rounded-none md:rounded-2xl border-b md:border border-zinc-700/50 backdrop-blur-xl mb-0 md:mb-4 z-50 shadow-2xl">
                                {tabs.map(num => (
                                    <button key={num} onClick={() => handleTabChange(num)} className={`py-3 md:py-2 text-[6px] md:text-[7px] font-black rounded-lg md:rounded-xl transition-all duration-500 border ${activeTab === num ? 'bg-cyan-900/80 text-cyan-400 border-cyan-500/50 shadow-[0_0_20px_rgba(0,255,255,0.4)]' : 'text-zinc-500 border-transparent'}`}>
                                        {WHITE_PAPER[num].label.substring(0, 3)}
                                    </button>
                                ))}
                            </div>

                            {/* Viewport */}
                            <div className="relative flex-1 aspect-[9/16] bg-black/50 md:bg-black/70 rounded-none md:rounded-[3.8rem] overflow-hidden border-0 md:border-[14px] border-zinc-800/80 ring-0 md:ring-2 ring-zinc-700 flex flex-col shadow-[0_0_150px_rgba(0,0,0,1)]">
                                <button onClick={goToPrev} disabled={activeTab === '01'} className={`absolute left-1.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/60 border border-cyan-400/40 text-cyan-400 z-[90] shadow-[0_0_15px_rgba(0,255,255,0.4)] flex items-center justify-center transition-all ${activeTab === '01' ? 'opacity-0 pointer-events-none' : 'opacity-100 active:scale-90'}`}>
                                    <Icon name="chevronLeft" size={16} strokeWidth={3} />
                                </button>
                                <button onClick={goToNext} disabled={activeTab === '06'} className={`absolute right-1.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-black/60 border border-cyan-400/40 text-cyan-400 z-[90] shadow-[0_0_15px_rgba(0,255,255,0.4)] flex items-center justify-center transition-all ${activeTab === '06' ? 'opacity-0 pointer-events-none' : 'opacity-100 active:scale-90'}`}>
                                    <Icon name="chevronRight" size={16} strokeWidth={3} />
                                </button>
                                <div className="absolute inset-0 bg-gradient-to-b from-black/95 via-transparent to-black/98 z-0"></div>
                                
                                <div 
                                    ref={scrollRef} 
                                    onScroll={(e) => setScrollProgress((e.target.scrollTop / (e.target.scrollHeight - e.target.clientHeight)) * 100)}
                                    className="relative z-10 h-full flex flex-col p-6 md:p-10 overflow-y-auto scrollbar-hidden scroll-smooth"
                                >
                                    <header className="pt-2 flex flex-col items-center shrink-0">
                                        <h1 className="logo-style-header text-3xl font-black tracking-[0.7em]">EXON</h1>
                                        <p className="text-[6px] tracking-[1.4em] text-zinc-500 font-bold uppercase mt-1 opacity-40">Intelligence Evolution</p>
                                    </header>

                                    <div className="mt-8 pb-4 relative">
                                        {/* Morphing Title */}
                                        <div className={`title-morph ${isMorphing ? 'title-big' : 'title-normal'}`}>
                                            <div className="flex items-center justify-start gap-3 mb-2">
                                                <div className="p-2.5 bg-cyan-500/10 rounded-xl border border-cyan-400/30 shadow-[0_0_10px_rgba(255,255,255,0.15)]">
                                                    <Icon name={WHITE_PAPER[activeTab].icon} color="#00ffff" size={20} />
                                                </div>
                                                <span className="text-[10px] text-cyan-300 font-mono font-bold tracking-widest uppercase italic">SYSTEM NODE 0{activeTab}</span>
                                            </div>
                                            <h2 className="text-4xl font-extrabold tracking-tight leading-[1.1] text-white italic drop-shadow-[0_0_20px_rgba(255,255,255,0.4)] mb-2">{WHITE_PAPER[activeTab].title}</h2>
                                            <p className="text-cyan-400 text-[11px] font-bold tracking-[0.25em] mb-8 uppercase leading-relaxed text-left">{WHITE_PAPER[activeTab].subtitle}</p>
                                        </div>

                                        <div className={`space-y-1.5 content-reveal ${isMorphing ? 'content-hidden' : 'content-visible'}`}>
                                            {WHITE_PAPER[activeTab].content.map((para, i) => (
                                                <p key={i} className={`text-[14px] leading-[2.3] text-zinc-100 font-light ${i === 0 ? 'logo-angled-frame p-8 mb-8 mt-4' : 'mb-0'}`}>{para}</p>
                                            ))}
                                            {WHITE_PAPER[activeTab].table && (
                                                <div className="w-full bg-zinc-900/70 border border-cyan-400/20 rounded-2xl p-4 overflow-hidden shadow-2xl mt-8">
                                                    <p className="text-[9px] text-cyan-400 font-bold tracking-[0.3em] mb-4 uppercase text-left pl-2">System Benchmarking</p>
                                                    <table className="tech-table">
                                                        <thead><tr>{WHITE_PAPER[activeTab].table.headers.map(h => <th key={h}>{h}</th>)}</tr></thead>
                                                        <tbody>{WHITE_PAPER[activeTab].table.rows.map((row, idx) => (
                                                            <tr key={idx}>{row.map((cell, cidx) => <td key={cidx} className={cidx === 2 ? 'text-cyan-400 font-black' : ''}>{cell}</td>)}</tr>
                                                        ))}</tbody>
                                                    </table>
                                                </div>
                                            )}
                                            {WHITE_PAPER[activeTab].chart && (
                                                <div className="w-full bg-zinc-900/70 border border-cyan-400/20 rounded-2xl p-8 shadow-2xl mt-8">
                                                    <p className="text-[9px] text-cyan-400 font-bold tracking-[0.3em] mb-8 uppercase text-left pl-2">Profit Scaling Analysis</p>
                                                    <div className="flex items-end justify-between h-28 gap-3">
                                                        {[10, 35, 60, 85, 100].map((h, i) => (<div key={i} className={`flex-1 rounded-t-sm transition-all duration-1000 ${i === 0 ? 'bg-zinc-800 h-[10%]' : i === 4 ? 'bg-cyan-400 h-[100%] shadow-[0_0_20px_rgba(0,255,255,0.6)]' : 'bg-zinc-900/40 h-['+h+'%]'}`}></div>))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className={`fixed bottom-4 left-1/2 -translate-x-1/2 flex flex-col items-center transition-all duration-1000 pointer-events-none z-[100] ${scrollProgress > 95 ? 'opacity-0 translate-y-10 scale-50' : 'opacity-100'}`}>
                                    <div className="flex flex-col items-center animate-bounce">
                                        <p className="text-[9px] text-cyan-400 font-black tracking-[0.4em] mb-1 opacity-80 uppercase">SCROLL</p>
                                        <Icon name="chevronDown" color="#00ffff" size={48} strokeWidth={1} className="drop-shadow-[0_0_15px_#00ffff]" />
                                    </div>
                                </div>
                            </div>
                            <div className="flex gap-3 mt-4 md:mt-8 opacity-25 pb-6 md:pb-0 justify-center">
                                {tabs.map(num => (
                                    <div key={num} className={`w-1.5 h-1.5 rounded-full transition-all duration-500 ${activeTab === num ? 'bg-cyan-400 w-6 shadow-[0_0_10px_#00ffff]' : 'bg-zinc-800'}`}></div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
